[alias]
lint = "clippy --all-targets --all-features -- -D warnings"
fmt-check = "fmt --all -- --check"

coverage = "llvm-cov --workspace --all-features --html --open"
coverage-summary = "llvm-cov --workspace --all-features --summary-only"
coverage-lcov = "llvm-cov --workspace --all-features --lcov --output-path lcov.info"
coverage-clean = "llvm-cov clean --workspace"
ci = "llvm-cov --workspace --all-features --summary-only"