# deny.toml
# Configuration for cargo-deny

[graph]
all-features = true

[advisories]
vulnerability = "deny"

# Check unmaintained crates in the whole dependency graph,
# but don't fail CI because of them.
unmaintained = "all"

# Warn about yanked crates.
yanked = "warn"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "warn"