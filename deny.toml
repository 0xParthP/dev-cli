# deny.toml
# Compatible with cargo-deny v0.19+

[graph]
all-features = true

[advisories]
# Vulnerabilities and unsound crates are denied by default.
# Only configure behaviour that differs from the defaults.

# Warn if a crate version has been yanked from crates.io.
yanked = "warn"

# Ignore specific advisories here if needed in the future.
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "warn"