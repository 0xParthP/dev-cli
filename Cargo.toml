[workspace]
members = [".", "xtask"]
resolver = "2"

[package]
name = "dev-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/0xParthP/dev-cli"
authors = ["Parth Prajapati"]
description = "A modern Git project manager for developers."
readme = "README.md"

[[bin]]
name = "dev"
path = "src/main.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
directories = "6"
ignore = "0.4"
owo-colors = "4"
tracing-subscriber = "0.3"
which = "8"
cliclack = "0.5"
console = "0.16"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
serial_test = "3"