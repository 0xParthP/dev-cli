name: Coverage

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  coverage:
    name: LLVM Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate HTML coverage report
        run: cargo llvm-cov --workspace --all-features --html

      - name: Generate LCOV report
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info

      - name: Generate Markdown summary
        run: cargo llvm-cov --workspace --all-features --summary-only > coverage-summary.txt

      - name: Publish coverage summary
        run: |
          echo "## Code Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat coverage-summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v5
        with:
          name: llvm-cov-html
          path: target/llvm-cov-target/llvm-cov/html
          if-no-files-found: error

      - name: Upload LCOV report
        uses: actions/upload-artifact@v5
        with:
          name: llvm-cov-lcov
          path: lcov.info
          if-no-files-found: error