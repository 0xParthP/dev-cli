name: Coverage & SonarQube Analysis

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  coverage:
    name: LLVM Coverage + SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run coverage instrumentation
        run: cargo llvm-cov --workspace --exclude xtask --all-features --no-report

      - name: Generate HTML coverage report
        run: cargo llvm-cov report --html

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v5
        with:
          name: llvm-cov-html
          path: target/llvm-cov/html
          if-no-files-found: error

      - name: Generate LCOV report
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload LCOV report
        uses: actions/upload-artifact@v5
        with:
          name: llvm-cov-lcov
          path: lcov.info
          if-no-files-found: error

      - name: Generate coverage summary
        run: cargo coverage-summary > coverage-summary.txt

      - name: Publish coverage summary
        shell: bash
        run: |
          {
            echo "## Code Coverage"
            echo
            cat coverage-summary.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce minimum line coverage
        shell: bash
        run: |
          LINE_COVERAGE=$(grep "^TOTAL" coverage-summary.txt | awk '{print $10}' | tr -d '%')

          echo "Line coverage: ${LINE_COVERAGE}%"

          awk -v cov="$LINE_COVERAGE" 'BEGIN {
            if (cov + 0 < 80.0) {
              printf("Coverage %.2f%% is below required 80%%\n", cov + 0);
              exit 1;
            }
          }'

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}