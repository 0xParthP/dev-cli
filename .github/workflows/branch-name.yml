name: Branch Name

on:
  push:
    branches-ignore:
      - main

  pull_request:
    branches:
      - main

jobs:
  validate-branch-name:
    name: Validate Branch Name
    runs-on: ubuntu-latest

    steps:
      - name: Check branch name
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"

          echo "Branch: $BRANCH"

          if [[ "$BRANCH" =~ ^main$ ]]; then
            echo "Skipping validation for main."
            exit 0
          fi

          PATTERN='^feature/[a-z0-9]+(-[a-z0-9]+)*$'

          if [[ ! "$BRANCH" =~ $PATTERN ]]; then
            echo "❌ Invalid branch name."
            echo
            echo "Expected:"
            echo "  feature/repository-scanner"
            echo "  feature/ide-detection"
            echo "  feature/cache-index"
            exit 1
          fi

          echo "✅ Branch name is valid."