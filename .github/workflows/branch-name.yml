name: Branch Name

on:
  push:
    branches-ignore:
      - main

  pull_request:
    branches:
      - main

jobs:
  validate-branch-name:
    name: Validate Branch Name
    runs-on: ubuntu-latest

    steps:
      - name: Check branch name
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"

          echo "Branch: $BRANCH"

          if [[ "$BRANCH" =~ ^main$ ]]; then
            echo "Skipping validation for main."
            exit 0
          fi

          PATTERN='^(feature|fix|docs|refactor|chore)/[a-z0-9]+(-[a-z0-9]+)*$'

          if [[ ! "$BRANCH" =~ $PATTERN ]]; then
            echo "❌ Invalid branch name."
            echo
            echo "Allowed branch prefixes:"
            echo "  feature/<feature-name>"
            echo "  fix/<bug-name>"
            echo "  docs/<doc-name>"
            echo "  refactor/<area>"
            echo "  chore/<maintenance>"
            echo
            echo "Examples:"
            echo "  feature/repository-scanner"
            echo "  feature/ide-detection"
            echo "  feature/testing-improvements"
            echo "  fix/ide-detection-crash"
            echo "  docs/update-readme"
            echo "  refactor/config-module"
            echo "  chore/update-dependencies"
            exit 1
          fi

          echo "✅ Branch name is valid."